<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Circuit traces -->
  <g stroke="#1e293b" stroke-width="2" fill="none">
    <path d="M0 80 H200 L240 120 H400"/>
    <path d="M0 240 H180 L220 200 H380"/>
    <path d="M800 60 H1000 L1040 100 H1200"/>
    <path d="M820 260 H980 L1020 220 H1200"/>
    <circle cx="240" cy="120" r="4" fill="#22d3ee" opacity="0.6"/>
    <circle cx="220" cy="200" r="4" fill="#a78bfa" opacity="0.6"/>
    <circle cx="1040" cy="100" r="4" fill="#f472b6" opacity="0.6"/>
  </g>

  <!-- Broken circuit symbol (center) -->
  <g transform="translate(520, 90)" filter="url(#glow)">
    <!-- Left rail -->
    <rect x="0" y="40" width="70" height="12" rx="2" fill="#22d3ee"/>
    <!-- Right rail -->
    <rect x="130" y="40" width="70" height="12" rx="2" fill="#f472b6"/>
    <!-- Switch arm (open) -->
    <line x1="70" y1="46" x2="115" y2="20" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
    <!-- Contact points -->
    <circle cx="70" cy="46" r="8" fill="#22d3ee"/>
    <circle cx="130" cy="46" r="8" fill="#f472b6"/>
  </g>

  <!-- Title -->
  <text x="600" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="64" font-weight="700" fill="url(#neon)" filter="url(#glow)">BREAKER</text>

  <!-- Subtitle -->
  <text x="600" y="255" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" fill="#94a3b8">Circuit Breaker · Pure Rust · Zero Dependencies</text>

  <!-- Small status indicators -->
  <g font-family="ui-monospace, monospace" font-size="13">
    <circle cx="80" cy="290" r="5" fill="#22c55e"/>
    <text x="92" y="294" fill="#86efac">CLOSED</text>
    <circle cx="200" cy="290" r="5" fill="#ef4444"/>
    <text x="212" y="294" fill="#fca5a5">OPEN</text>
    <circle cx="300" cy="290" r="5" fill="#eab308"/>
    <text x="312" y="294" fill="#fde047">HALF-OPEN</text>
  </g>
</svg>
